services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile-prod
    restart: unless-stopped
    volumes:
      - ./logs/backend:/var/log/backend
  proxy:
    build: ./proxy
    ports:
      - 80:80
    depends_on:
      - backend
    restart: unless-stopped
    volumes:
      - ./logs/proxy:/var/log/nginx